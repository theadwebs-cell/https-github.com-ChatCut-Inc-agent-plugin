name: OYC Android (Play Store)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        type: choice
        options: [both, customer, partner]
        default: both
      version_name:
        description: "Version shown in the store (e.g. 1.0.1)"
        default: "1.0"
  push:
    paths:
      - "oyc-mobile/**"
      - ".github/workflows/oyc-android.yml"

jobs:
  key:
    name: Upload key
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.k.outputs.new }}
    steps:
      - name: Use saved key or create one
        id: k
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p key
          if [ -n "$KS_B64" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore key/upload.jks -alias oyc-upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=On Your Call, O=On Your Call, L=Hyderabad, ST=Telangana, C=IN"
          base64 -w0 key/upload.jks > key/ANDROID_KEYSTORE_BASE64.txt
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=oyc-upload\nANDROID_KEY_PASSWORD=%s\n' "$PASS" "$PASS" > key/passwords.txt
          echo "new=yes" >> "$GITHUB_OUTPUT"
      - name: Save the new upload key (first run only)
        if: steps.k.outputs.new == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-android-upload-key
          path: key
          retention-days: 7

  build:
    needs: key
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner]
    env:
      LOGO_URL: https://media.flexifunnels.io/33238/images/image_wlhdndac.jpg
    steps:
      - name: Skip if not selected
        id: sel
        run: |
          want="${{ github.event.inputs.app || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.app }}" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.sel.outputs.run == 'yes'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.sel.outputs.run == 'yes'
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        if: steps.sel.outputs.run == 'yes'
        working-directory: oyc-mobile/${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: App icon and splash from the OYC logo
        if: steps.sel.outputs.run == 'yes'
        working-directory: oyc-mobile/${{ matrix.app }}
        run: |
          command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)
          mkdir -p assets
          curl -fsSL "$LOGO_URL" -o assets/logo-src.jpg
          convert assets/logo-src.jpg -resize 1024x1024 -background black -gravity center -extent 1024x1024 assets/icon-only.png
          convert assets/logo-src.jpg -resize 640x640 -background black -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:black assets/icon-background.png
          convert assets/logo-src.jpg -resize 900x900 -background black -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx --yes @capacitor/assets@3 generate --android

      - name: Sync Capacitor
        if: steps.sel.outputs.run == 'yes'
        working-directory: oyc-mobile/${{ matrix.app }}
        run: npx cap sync android

      - name: Get the new upload key
        if: steps.sel.outputs.run == 'yes' && needs.key.outputs.new == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: SAVE-THIS-android-upload-key
          path: ${{ runner.temp }}/key

      - name: Prepare signing
        if: steps.sel.outputs.run == 'yes'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"; echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"; echo "ANDROID_KEY_PASSWORD=$KEY_PASS"; } >> "$GITHUB_ENV"
          else
            cp "$RUNNER_TEMP/key/upload.jks" "$RUNNER_TEMP/upload.jks"
            cat "$RUNNER_TEMP/key/passwords.txt" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Play Store bundle (.aab) and test APK
        if: steps.sel.outputs.run == 'yes'
        working-directory: oyc-mobile/${{ matrix.app }}/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload app files
        if: steps.sel.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: oyc-${{ matrix.app }}-android-v${{ github.run_number }}
          path: |
            oyc-mobile/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
            oyc-mobile/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
