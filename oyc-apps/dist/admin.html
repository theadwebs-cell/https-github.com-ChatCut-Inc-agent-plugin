<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow">
<title>OYC Admin – On Your Call</title>
<link rel="icon" href="https://media.flexifunnels.io/33238/images/oyc-logo_sgw4kngl.png">
<link rel="apple-touch-icon" href="https://media.flexifunnels.io/33238/images/oyc-logo_sgw4kngl.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#545454;--mute:#8a8a8a;--line:#ececec;--soft:#f6f6f6;--gold:#c89b3c;--gold2:#a77d24;--goldbg:#fbf4e4;--ok:#0f8a4c;--okbg:#e9f7ef;--warn:#b26a00;--warnbg:#fff4e0;--bad:#c2341f;--badbg:#fdecea;--wa:#1faa59;--ff-accent:#111;--ff-accent-hover:#000;--ff-btn-text:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;font-size:15px;min-height:46px;text-align:center}
.btn:disabled{opacity:.55;cursor:default}
.btn.gold{background:var(--gold);color:#fff}.btn.wa{background:var(--wa);color:#fff}
.btn.line{background:#fff;color:var(--ink);border:1px solid #d9d9d9}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.inp{width:100%;padding:13px 14px;border:1px solid #dcdcdc;border-radius:10px;background:#fff;font-size:15px;outline:none}
.inp:focus{border-color:var(--ink)}
textarea.inp{min-height:80px;resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink2)}
.muted{color:var(--mute);font-size:13px}.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:#fff;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-pending{background:var(--warnbg);color:var(--warn)}.st-assigned,.st-accepted{background:#eaf1ff;color:#2754c5}.st-ontheway,.st-inprogress{background:var(--goldbg);color:var(--gold2)}.st-completed{background:var(--okbg);color:var(--ok)}.st-cancelled{background:var(--badbg);color:var(--bad)}.st-active{background:var(--okbg);color:var(--ok)}.st-blocked{background:var(--badbg);color:var(--bad)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.sep{height:8px;background:var(--soft);margin:0 -16px}
.hr{height:1px;background:var(--line);margin:14px 0}
.hide{display:none!important}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.logo{object-fit:contain;background:#fff;border-radius:10px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer}
.map{width:100%;height:190px;border:0;border-radius:12px;background:var(--soft)}
.tl{position:relative;padding-left:26px}
.tl .s{position:relative;padding:0 0 16px}
.tl .s:before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#d6d6d6}
.tl .s:after{content:'';position:absolute;left:-16px;top:18px;bottom:-2px;width:2px;background:#e3e3e3}
.tl .s:last-child:after{display:none}
.tl .s.done:before{background:var(--ok)}.tl .s.done:after{background:var(--ok)}
.tl .s.now:before{background:var(--gold);box-shadow:0 0 0 4px var(--goldbg)}
.tl .s b{display:block;font-size:14px}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.empty svg{color:#c9c9c9;margin:0 auto 10px}

body{background:#f5f5f4}
.lay{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#111;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.side .brand img{width:42px;height:42px}
.side .brand b{display:block;font-size:15px}.side .brand span{font-size:11px;color:#c9a75a;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#cfcfcf;cursor:pointer;font-weight:500;font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:#1e1e1e}.nav.on{background:#262626;color:#fff;font-weight:700}.nav.on svg{color:var(--gold)}
.nav .n{margin-left:auto;background:var(--gold);color:#111;font-size:11px;font-weight:800;border-radius:9px;padding:1px 7px}
.main{padding:22px 26px 90px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.kpi span{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi b{display:block;font-size:28px;margin-top:4px;letter-spacing:-.02em}
.kpi.dark{background:#111;color:#fff;border-color:#111}.kpi.dark span{color:#c9a75a}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafafa}
.scroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{width:auto;min-width:220px;padding:10px 12px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;justify-content:flex-end}
.drawer.open{display:flex}
.drawer .dp{background:#fff;width:100%;max-width:560px;height:100%;overflow:auto;padding:0 20px 30px;animation:sl .2s ease}
@keyframes sl{from{transform:translateX(40px);opacity:.5}}
.dp .dh{position:sticky;top:0;background:#fff;padding:16px 0 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv span{color:var(--mute)}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mtop{display:none}
.mnav{display:none}
.svcp{display:grid;grid-template-columns:1fr 110px 80px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.svcp input[type=number]{padding:8px 10px}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:#ccc;border:0;cursor:pointer}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.pickrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pickrow .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.pickrow .step button{border:0;background:none;width:30px;height:30px;font-size:17px;cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:#111;padding:20px}
.login .box{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:380px;text-align:center}
.login img{width:88px;height:88px;margin:0 auto 12px;border-radius:20px}
.pin{letter-spacing:.5em;font-size:22px;text-align:center}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.online.y{background:var(--ok)}
.demo{background:var(--warnbg);color:var(--warn);font-size:12.5px;padding:9px 14px;border-radius:10px;margin-bottom:14px}
@media(max-width:900px){
 .lay{grid-template-columns:1fr}.side{display:none}
 .mtop{display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30}
 .mtop img{width:36px;height:36px}
 .main{padding:16px 14px 90px}
 .kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
 .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .mnav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute);cursor:pointer;position:relative}
 .mnav button.on{color:var(--ink);font-weight:700}
 .mnav .n{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:9.5px;border-radius:8px;padding:0 5px}
 .filters .inp{min-width:0;flex:1}
 .tbl.resp thead{display:none}.tbl.resp tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:#fff}
 .tbl.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 10px;text-align:right}
 .tbl.resp td:before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left;flex:none}
 .f2{grid-template-columns:1fr}.kv{grid-template-columns:100px 1fr}
}
</style></head>
<body>
<div id="vLogin" class="login hide"><div class="box">
  <img class="logo" src="https://media.flexifunnels.io/33238/images/oyc-logo_sgw4kngl.png" alt="On Your Call logo" width="88" height="88">
  <h1 style="font-size:22px">OYC Admin</h1><p class="muted" style="margin:4px 0 20px">Enter your admin PIN to continue</p>
  <input class="inp pin" id="aPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')login()">
  <button class="btn block" style="margin-top:16px" id="lBtn" onclick="login()">Login</button>
  <p class="muted small" id="lHint" style="margin-top:14px"></p>
</div></div>

<div id="vApp" class="hide">
<div class="mtop"><img class="logo" src="https://media.flexifunnels.io/33238/images/oyc-logo_sgw4kngl.png" alt="OYC"><b class="grow" id="mTitle">Dashboard</b><button class="ib" style="background:#262626;color:#fff" onclick="load(true)" data-ic="refresh"></button><button class="ib" style="background:var(--gold);color:#111" onclick="openNew()" data-ic="plus"></button></div>
<div class="lay">
<aside class="side">
  <div class="brand"><img class="logo" src="https://media.flexifunnels.io/33238/images/oyc-logo_sgw4kngl.png" alt="On Your Call logo"><div><b>On Your Call</b><span>Admin panel</span></div></div>
  <button class="nav" data-v="dash" onclick="view('dash')"><span data-ic="grid"></span>Dashboard</button>
  <button class="nav" data-v="bookings" onclick="view('bookings')"><span data-ic="cal"></span>Bookings<i class="n hide" id="nPend"></i></button>
  <button class="nav" data-v="partners" onclick="view('partners')"><span data-ic="users"></span>Partners<i class="n hide" id="nApp"></i></button>
  <button class="nav" data-v="customers" onclick="view('customers')"><span data-ic="user"></span>Customers</button>
  <button class="nav" data-v="services" onclick="view('services')"><span data-ic="tag"></span>Services & prices</button>
  <button class="nav" data-v="settings" onclick="view('settings')"><span data-ic="gear"></span>Settings</button>
  <div style="margin-top:auto"><button class="btn gold block" onclick="openNew()">+ Add WhatsApp booking</button><button class="nav" style="margin-top:8px" onclick="logout()"><span data-ic="logout"></span>Logout</button></div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mnav">
  <button data-v="dash" onclick="view('dash')"><span data-ic="grid"></span>Home</button>
  <button data-v="bookings" onclick="view('bookings')"><span data-ic="cal"></span><i class="n hide" id="mPend"></i>Bookings</button>
  <button data-v="partners" onclick="view('partners')"><span data-ic="users"></span>Partners</button>
  <button data-v="services" onclick="view('services')"><span data-ic="tag"></span>Prices</button>
  <button data-v="settings" onclick="view('settings')"><span data-ic="gear"></span>More</button>
</nav>
</div>

<div class="drawer" id="drw" onclick="if(event.target===this)closeDrw()"><div class="dp" id="drwBody"></div></div>

<script>
/* OYC shared booking logic. Runs in the browser (demo mode) AND in Google Apps Script. */
function oycDigits(p){return String(p||'').replace(/\D/g,'').slice(-10)}
function oycNow(){return new Date().toISOString()}
function oycErr(m){return {ok:false,error:m}}
function oycOk(d,dirty){return {ok:true,data:d,dirty:dirty||[]}}
function oycPub(b){var c=JSON.parse(JSON.stringify(b));return c}
function oycForPartner(b){var c=oycPub(b);delete c.otp;return c}
function oycPartnerSafe(p){var c=JSON.parse(JSON.stringify(p));delete c.pin;return c}
function oycHist(b,s,by){b.history=b.history||[];b.history.push({s:s,t:oycNow(),by:by||''});b.status=s;b.updated=oycNow()}

function oycHandle(db,req){
  db.bookings=db.bookings||[];db.partners=db.partners||[];db.settings=db.settings||{};
  var S=db.settings,a=req.action;
  if(!S.adminPin)S.adminPin='1234';
  function findB(id){for(var i=0;i<db.bookings.length;i++)if(db.bookings[i].id===id)return db.bookings[i];return null}
  function findP(id){for(var i=0;i<db.partners.length;i++)if(db.partners[i].id===id)return db.partners[i];return null}
  function authPartner(){var ph=oycDigits(req.phone);for(var i=0;i<db.partners.length;i++){var p=db.partners[i];if(oycDigits(p.phone)===ph&&String(p.pin)===String(req.pin))return p}return null}
  function isAdmin(){return String(req.pin||'')===String(S.adminPin)}
  function newId(){var n=1001+db.bookings.length;var id='OYC'+n;while(findB(id)){n++;id='OYC'+n}return id}
  function makeBooking(src,by){
    var b=req.booking||{};
    if(!b.name||oycDigits(b.phone).length!==10)return oycErr('Please enter name and a 10-digit mobile number');
    if(!b.address)return oycErr('Please add the service address');
    if(!b.items||!b.items.length)return oycErr('Please add at least one service');
    var nb={id:newId(),created:oycNow(),source:src,name:String(b.name).slice(0,80),phone:oycDigits(b.phone),
      address:String(b.address).slice(0,300),landmark:String(b.landmark||'').slice(0,120),lat:b.lat||'',lng:b.lng||'',
      category:b.category||'',items:b.items,total:Number(b.total)||0,date:b.date||'',slot:b.slot||'',
      notes:String(b.notes||'').slice(0,500),payMode:b.payMode||'Pay after service',status:'Pending',
      partnerId:'',partnerName:'',partnerPhone:'',otp:String(Math.floor(1000+Math.random()*9000)),
      amountPaid:'',rating:'',review:'',adminNotes:b.adminNotes||'',updated:oycNow(),history:[]};
    oycHist(nb,'Pending',by);db.bookings.push(nb);return oycOk(oycPub(nb),['bookings'])
  }
  switch(a){
  /* ---------- customer ---------- */
  case 'catalog': return oycOk({prices:S.prices||{},off:S.off||{},wa:S.wa||'',fee:S.fee||0});
  case 'createBooking': return makeBooking('App','customer');
  case 'myBookings': {var ph=oycDigits(req.phone);if(ph.length!==10)return oycErr('Login required');
    return oycOk(db.bookings.filter(function(b){return oycDigits(b.phone)===ph}).map(oycPub).reverse())}
  case 'cancelBooking': {var b=findB(req.id);if(!b||oycDigits(b.phone)!==oycDigits(req.phone))return oycErr('Booking not found');
    if(['Pending','Assigned','Accepted'].indexOf(b.status)<0)return oycErr('This booking can no longer be cancelled in the app. Please call us.');
    oycHist(b,'Cancelled','customer');return oycOk(oycPub(b),['bookings'])}
  case 'rateBooking': {var b=findB(req.id);if(!b||oycDigits(b.phone)!==oycDigits(req.phone))return oycErr('Booking not found');
    if(b.status!=='Completed')return oycErr('You can rate after the service is completed');
    b.rating=Math.max(1,Math.min(5,Number(req.rating)||5));b.review=String(req.review||'').slice(0,500);b.updated=oycNow();return oycOk(oycPub(b),['bookings'])}
  /* ---------- partner ---------- */
  case 'partnerApply': {var p=req.partner||{};if(!p.name||oycDigits(p.phone).length!==10||!/^\d{4}$/.test(String(p.pin||'')))return oycErr('Enter name, 10-digit mobile and a 4-digit PIN');
    for(var i=0;i<db.partners.length;i++)if(oycDigits(db.partners[i].phone)===oycDigits(p.phone))return oycErr('This mobile number is already registered');
    var np={id:'P'+(101+db.partners.length),name:String(p.name).slice(0,80),phone:oycDigits(p.phone),pin:String(p.pin),skills:String(p.skills||''),zone:String(p.zone||''),status:'Pending',online:'no',joined:oycNow(),notes:String(p.notes||'').slice(0,300)};
    db.partners.push(np);return oycOk(oycPartnerSafe(np),['partners'])}
  case 'partnerLogin': {var p=authPartner();if(!p)return oycErr('Wrong mobile number or PIN');
    if(p.status!=='Active')return oycErr(p.status==='Pending'?'Your registration is under review by OYC. We will call you.':'Your account is not active. Please contact OYC.');
    return oycOk(oycPartnerSafe(p))}
  case 'partnerJobs': {var p=authPartner();if(!p||p.status!=='Active')return oycErr('Session expired. Please log in again.');
    return oycOk({partner:oycPartnerSafe(p),jobs:db.bookings.filter(function(b){return b.partnerId===p.id}).map(oycForPartner).reverse()})}
  case 'partnerOnline': {var p=authPartner();if(!p)return oycErr('Session expired');p.online=req.online?'yes':'no';return oycOk(oycPartnerSafe(p),['partners'])}
  case 'partnerAction': {var p=authPartner();if(!p||p.status!=='Active')return oycErr('Session expired');
    var b=findB(req.id);if(!b||b.partnerId!==p.id)return oycErr('Job not found');
    var act=req.act,who='partner:'+p.name;
    if(act==='accept'){if(b.status!=='Assigned')return oycErr('Job is not waiting for acceptance');oycHist(b,'Accepted',who)}
    else if(act==='decline'){if(['Assigned','Accepted'].indexOf(b.status)<0)return oycErr('Cannot decline now');b.partnerId='';b.partnerName='';b.partnerPhone='';oycHist(b,'Pending','declined by '+p.name)}
    else if(act==='onway'){if(b.status!=='Accepted')return oycErr('Accept the job first');oycHist(b,'On the way',who)}
    else if(act==='start'){if(['Accepted','On the way'].indexOf(b.status)<0)return oycErr('Job cannot be started now');
      if(String(req.otp)!==String(b.otp))return oycErr('Wrong start code. Ask the customer for the 4-digit code shown in their OYC app.');oycHist(b,'In progress',who)}
    else if(act==='complete'){if(b.status!=='In progress')return oycErr('Start the job first');b.amountPaid=Number(req.amount)||b.total;b.payMode=req.mode||b.payMode;oycHist(b,'Completed',who)}
    else return oycErr('Unknown action');
    return oycOk(oycForPartner(b),['bookings'])}
  /* ---------- admin ---------- */
  case 'adminLogin': return isAdmin()?oycOk({ok:1}):oycErr('Wrong admin PIN');
  case 'adminData': {if(!isAdmin())return oycErr('Wrong admin PIN');var st=JSON.parse(JSON.stringify(S));delete st.adminPin;
    return oycOk({bookings:db.bookings.map(oycPub).reverse(),partners:db.partners.map(function(p){return JSON.parse(JSON.stringify(p))}),settings:st})}

function fmtTime(iso){if(!iso)return '';var x=new Date(iso);return isNaN(x)?iso:x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function mapEmbed(b){var q=(b.lat&&b.lng)?(b.lat+','+b.lng):((b.address||'')+' Hyderabad');return 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=16&output=embed'}
function mapLink(b){var q=(b.lat&&b.lng)?(b.lat+','+b.lng):((b.address||'')+(b.landmark?', '+b.landmark:'')+', Hyderabad');return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)}
function waLink(num,text){return 'https://wa.me/'+String(num).replace(/\D/g,'').replace(/^(\d{10})$/,'91$1')+'?text='+encodeURIComponent(text)}
function itemsText(b){return (b.items||[]).map(function(i){return '• '+i.name+' x'+i.qty+(i.price?' – '+rupee(i.price*i.qty):'')}).join('\n')}
var STATUS_FLOW=['Pending','Assigned','Accepted','On the way','In progress','Completed'];
var STATUS_LABEL={'Pending':'Finding a professional','Assigned':'Professional assigned','Accepted':'Professional confirmed','On the way':'Professional on the way','In progress':'Service in progress','Completed':'Completed','Cancelled':'Cancelled'};
function stCls(s){return 'st-'+String(s).toLowerCase().replace(/\s+/g,'')}

/* ---- data layer ---- */
function oycLocalDb(){var db=store('oyc_demo_db');if(!db){db={bookings:[],partners:[{id:'P101',name:'Demo Partner',phone:'9999999999',pin:'1234',skills:'AC & Appliance Repair, Electrician, Plumber',zone:'Hyderabad',status:'Active',online:'yes',joined:oycNow(),notes:'Demo account'}],settings:{adminPin:'1234'}};store('oyc_demo_db',db)}return db}
function api(action,payload){
  var req=Object.assign({action:action},payload||{});
  if(OYC.API){
    return fetch(OYC.API,{method:'POST',body:JSON.stringify(req)}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Something went wrong');return j.data})
      .catch(function(e){if(e instanceof TypeError)throw new Error('No internet connection. Please try again.');throw e});
  }
  return new Promise(function(res,rej){setTimeout(function(){var db=oycLocalDb();var r=oycHandle(db,JSON.parse(JSON.stringify(req)));if(!r.ok)return rej(new Error(r.error));store('oyc_demo_db',db);res(JSON.parse(JSON.stringify(r.data)))},150)});
}
function busy(btn,on,label){if(!btn)return;if(on){btn._l=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+(label||'Please wait…')}else{btn.disabled=false;if(btn._l)btn.innerHTML=btn._l}}
/* install prompt */
var _inst=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();_inst=e;$$('[data-install]').forEach(function(b){b.style.display=''})});
function installApp(){if(_inst){_inst.prompt();_inst=null}else alert('To install: open your browser menu (⋮ or Share) and tap "Add to Home screen".')}

</script>
<script>
/* ================= ADMIN APP ================= */
var PIN=sessionStorage.getItem('oyc_admin_pin')||store('oyc_admin_pin_keep'),D={bookings:[],partners:[],settings:{}},V='dash',fStatus='Active',fQ='',fDate='',pollT=null,known=null,curB=null;
function fillIcons(r){$$('[data-ic]',r).forEach(function(e){if(!e.innerHTML.trim())e.innerHTML=ic(e.dataset.ic)})}
function login(){var p=$('#aPin').value.trim();if(!p)return;var b=$('#lBtn');busy(b,true);api('adminLogin',{pin:p}).then(function(){PIN=p;sessionStorage.setItem('oyc_admin_pin',p);busy(b,false);start()}).catch(function(e){busy(b,false);toast(e.message)})}
function logout(){sessionStorage.removeItem('oyc_admin_pin');localStorage.removeItem('oyc_admin_pin_keep');PIN=null;location.reload()}
function start(){$('#vLogin').classList.add('hide');$('#vApp').classList.remove('hide');load().then(function(){view(V)});if(pollT)clearInterval(pollT);pollT=setInterval(function(){load()},20000)}
function load(manual){return api('adminData',{pin:PIN}).then(function(r){var ids=r.bookings.map(function(b){return b.id});
  if(known){var nw=ids.filter(function(i){return known.indexOf(i)<0});if(nw.length)ding(nw.length)}known=ids;D=r;applyCatalog(r.settings);counts();if(manual)toast('Updated');
  if(!$('#drw').classList.contains('open')||V==='bookings'&&curB)renderView();if(curB&&$('#drw').classList.contains('open')){var b=bk(curB);if(b&&!document.activeElement.closest('#drwBody'))openB(curB,true)}})
  .catch(function(e){if(/PIN/.test(e.message)){logout()}else if(manual)toast(e.message)})}
function ding(n){toast(n+' new booking'+(n>1?'s':'')+' received!');document.title='('+n+') New booking – OYC Admin';setTimeout(function(){document.title='OYC Admin – On Your Call'},8000);
  try{var A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=988;g.gain.value=.15;o.start();setTimeout(function(){o.frequency.value=1319},150);setTimeout(function(){o.stop()},380)}catch(e){}}
function counts(){var p=D.bookings.filter(function(b){return b.status==='Pending'}).length,a=D.partners.filter(function(x){return x.status==='Pending'}).length;
  [['#nPend',p],['#mPend',p],['#nApp',a]].forEach(function(x){$(x[0]).textContent=x[1];$(x[0]).classList.toggle('hide',!x[1])})}
function view(v){V=v;closeDrw();$$('.nav,.mnav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});$('#mTitle').textContent={dash:'Dashboard',bookings:'Bookings',partners:'Partners',customers:'Customers',services:'Services & prices',settings:'Settings'}[v];renderView();window.scrollTo(0,0)}
function renderView(){var f={dash:vDash,bookings:vBookings,partners:vPartners,customers:vCustomers,services:vServices,settings:vSettings}[V];$('#main').innerHTML=(OYC.API?'':'<div class="demo"><b>Demo mode.</b> Data is saved in this browser only. Connect the Google Sheet (Settings) so customer, partner and admin apps share live bookings.</div>')+f();fillIcons($('#main'))}
function bk(id){return D.bookings.filter(function(b){return b.id===id})[0]}
function pt(id){return D.partners.filter(function(p){return p.id===id})[0]}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function svcNames(b){return (b.items||[]).map(function(i){return i.name+(i.qty>1?' ×'+i.qty:'')}).join(', ')}
function badge(s){return '<span class="badge '+stCls(s)+'">'+esc(s)+'</span>'}
function srcBadge(b){return b.source==='App'?'<span class="badge" style="background:#f1f1f1;color:#555">App</span>':'<span class="badge" style="background:#e7f8ee;color:#128a47">'+esc(b.source||'WhatsApp')+'</span>'}

/* ---- dashboard ---- */
function vDash(){var B=D.bookings,t=ymd(new Date()),m=t.slice(0,7);
  var pend=B.filter(function(b){return b.status==='Pending'}),today=B.filter(function(b){return b.date===t&&b.status!=='Cancelled'}),live=B.filter(function(b){return ['Assigned','Accepted','On the way','In progress'].indexOf(b.status)>=0}),
  rev=B.filter(function(b){return b.status==='Completed'&&String(b.updated).slice(0,7)===m}).reduce(function(a,b){return a+(Number(b.amountPaid)||0)},0),on=D.partners.filter(function(p){return p.status==='Active'&&p.online==='yes'}).length;
  var h='<div class="ph"><div><h1>Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+'</h1><div class="muted">'+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+'</div></div><button class="btn gold" onclick="openNew()">+ Add WhatsApp booking</button></div>';
  h+='<div class="kpis"><div class="kpi dark" onclick="fStatus=\'Pending\';view(\'bookings\')"><span>NEEDS ASSIGNMENT</span><b>'+pend.length+'</b></div><div class="kpi" onclick="fStatus=\'All\';fDate=\''+t+'\';view(\'bookings\')"><span>TODAY’S JOBS</span><b>'+today.length+'</b></div><div class="kpi" onclick="fStatus=\'Active\';view(\'bookings\')"><span>IN PROGRESS</span><b>'+live.length+'</b></div><div class="kpi"><span>COLLECTED THIS MONTH</span><b>'+rupee(rev)+'</b></div></div>';
  h+='<div class="grid2"><div class="panel"><div class="row between"><h3>Needs your action</h3><button class="btn ghost sm" onclick="fStatus=\'Pending\';view(\'bookings\')">View all</button></div>'+(pend.length?'<div class="scroll">'+bTable(pend.slice(0,8))+'</div>':'<p class="muted">All bookings are assigned. 🎉</p>')+'</div>';
  h+='<div class="panel"><h3>Partners</h3><div class="row" style="gap:24px;margin-bottom:12px"><div><b style="font-size:24px">'+on+'</b><div class="muted small">Online now</div></div><div><b style="font-size:24px">'+D.partners.filter(function(p){return p.status==='Active'}).length+'</b><div class="muted small">Active</div></div><div><b style="font-size:24px">'+D.partners.filter(function(p){return p.status==='Pending'}).length+'</b><div class="muted small">To approve</div></div></div>'+
   D.partners.filter(function(p){return p.status==='Active'}).slice(0,6).map(function(p){var n=B.filter(function(b){return b.partnerId===p.id&&['Assigned','Accepted','On the way','In progress'].indexOf(b.status)>=0}).length;return '<div class="row between" style="padding:8px 0;border-top:1px solid var(--line);font-size:14px"><span><i class="online'+(p.online==='yes'?' y':'')+'"></i>'+esc(p.name)+'</span><span class="muted">'+n+' active job'+(n===1?'':'s')+'</span></div>'}).join('')+
   '<button class="btn line sm block" style="margin-top:10px" onclick="view(\'partners\')">Manage partners</button></div></div>';
  h+='<div class="panel" style="margin-top:14px"><h3>Recent bookings</h3><div class="scroll">'+bTable(B.slice(0,10))+'</div></div>';return h}
function bTable(list){if(!list.length)return '<div class="empty">No bookings found.</div>';return '<table class="tbl resp"><thead><tr><th>Booking</th><th>Customer</th><th>Service</th><th>Slot</th><th>Area</th><th>Amount</th><th>Partner</th><th>Status</th></tr></thead><tbody>'+list.map(function(b){
  return '<tr class="click" onclick="openB(\''+b.id+'\')"><td data-l="Booking"><b>'+esc(b.id)+'</b><div>'+srcBadge(b)+'</div></td><td data-l="Customer">'+esc(b.name)+'<div class="muted small">'+esc(b.phone)+'</div></td><td data-l="Service" style="max-width:220px">'+esc(svcNames(b))+'</td><td data-l="Slot" style="white-space:nowrap">'+esc(fmtDate(b.date))+'<div class="muted small">'+esc(b.slot)+'</div></td><td data-l="Area" style="max-width:180px" class="small">'+esc(String(b.address).slice(0,60))+'</td><td data-l="Amount"><b>'+rupee(b.amountPaid||b.total)+'</b></td><td data-l="Partner">'+(b.partnerName?esc(b.partnerName):'<span style="color:var(--bad);font-weight:600">Unassigned</span>')+'</td><td data-l="Status">'+badge(b.status)+'</td></tr>'}).join('')+'</tbody></table>'}

/* ---- bookings ---- */
function vBookings(){var st=['Active','Pending','Assigned','Accepted','On the way','In progress','Completed','Cancelled','All'];
  var l=D.bookings.filter(function(b){if(fStatus==='Active'&&['Completed','Cancelled'].indexOf(b.status)>=0)return false;if(['Active','All'].indexOf(fStatus)<0&&b.status!==fStatus)return false;if(fDate&&b.date!==fDate)return false;
    if(fQ){var q=fQ.toLowerCase();return (b.id+' '+b.name+' '+b.phone+' '+b.address+' '+svcNames(b)+' '+b.partnerName).toLowerCase().indexOf(q)>=0}return true});
  return '<div class="ph"><h1>Bookings</h1><div class="row"><button class="btn line sm" onclick="exportCsv()">Export CSV</button><button class="btn gold sm" onclick="openNew()">+ Add WhatsApp booking</button></div></div>'+
  '<div class="filters"><input class="inp" placeholder="Search name, phone, ID, area…" value="'+esc(fQ)+'" oninput="fQ=this.value;clearTimeout(window._qt);window._qt=setTimeout(function(){renderView();var i=$(\'.filters .inp\');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"><input class="inp" type="date" style="min-width:0" value="'+fDate+'" onchange="fDate=this.value;renderView()">'+(fDate?'<button class="btn ghost sm" onclick="fDate=\'\';renderView()">Clear date</button>':'')+'</div>'+
  '<div class="filters">'+st.map(function(s){var n=s==='All'?D.bookings.length:s==='Active'?D.bookings.filter(function(b){return ['Completed','Cancelled'].indexOf(b.status)<0}).length:D.bookings.filter(function(b){return b.status===s}).length;return '<span class="chip'+(s===fStatus?' on':'')+'" onclick="fStatus=\''+s+'\';renderView()">'+s+' ('+n+')</span>'}).join('')+'</div>'+
  '<div class="panel" style="padding:6px 8px"><div class="scroll">'+bTable(l)+'</div></div>'}
function openB(id,keep){curB=id;var b=bk(id);if(!b)return;var act=D.partners.filter(function(p){return p.status==='Active'});
  var cat=String(b.category||'').toLowerCase();act.sort(function(x,y){var mx=String(x.skills).toLowerCase().split(',').some(function(s){return s.trim()&&cat.indexOf(s.trim())>=0}),my=String(y.skills).toLowerCase().split(',').some(function(s){return s.trim()&&cat.indexOf(s.trim())>=0});return (my-mx)||((y.online==='yes')-(x.online==='yes'))});
  var h='<div class="dh"><button class="ib" onclick="closeDrw()">'+ic('x')+'</button><div class="grow"><b style="font-size:18px">'+esc(b.id)+'</b><div class="muted small">Created '+fmtTime(b.created)+' · '+esc(b.source)+'</div></div>'+badge(b.status)+'</div>';
  h+='<div style="padding:16px 0"><h3 style="font-size:18px;margin-bottom:10px">'+esc(svcNames(b))+'</h3><div class="kv"><span>Customer</span><b>'+esc(b.name)+'</b><span>Mobile</span><div>'+esc(b.phone)+' · <a href="tel:'+esc(b.phone)+'" style="color:var(--gold2);font-weight:600">Call</a></div><span>Date & time</span><div>'+esc(fmtDate(b.date))+', '+esc(b.slot)+'</div><span>Address</span><div>'+esc(b.address)+(b.landmark?'<br><span class="muted">Landmark: '+esc(b.landmark)+'</span>':'')+'</div><span>Payment</span><div>'+esc(b.payMode)+'</div><span>Start code</span><b style="letter-spacing:.2em">'+esc(b.otp)+'</b>'+(b.notes?'<span>Customer note</span><div>'+esc(b.notes)+'</div>':'')+(b.rating?'<span>Rating</span><div>'+'★'.repeat(Number(b.rating))+' '+esc(b.review||'')+'</div>':'')+'</div></div>';
  h+='<iframe class="map" src="'+mapEmbed(b)+'" loading="lazy" title="Map"></iframe><a class="btn line sm" style="margin-top:8px" href="'+mapLink(b)+'" target="_blank" rel="noopener">'+ic('nav',16)+' Open in Google Maps</a>';
  h+='<div class="hr"></div><div class="panel" style="background:#fafafa"><b>Assign professional</b><div class="row" style="margin-top:10px"><select class="inp grow" id="dPartner"><option value="">— Unassigned —</option>'+act.map(function(p){return '<option value="'+p.id+'"'+(p.id===b.partnerId?' selected':'')+'>'+(p.online==='yes'?'● ':'○ ')+esc(p.name)+' · '+esc(p.skills||'')+'</option>'}).join('')+'</select><button class="btn" onclick="assign(this)">Assign</button></div><p class="muted small" style="margin-top:6px">● online now. Matching skills are listed first. The partner sees the job instantly in the Partner app.</p></div>';
  h+='<div class="row wrapf" style="margin-top:12px;gap:8px"><a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(b.phone,custMsg(b))+'">'+WA_SVG+' Confirm to customer</a>'+(b.partnerPhone?'<a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(b.partnerPhone,partnerMsg(b))+'">'+WA_SVG+' Send job to partner</a>':'')+'</div>';
  h+='<div class="hr"></div><b>Edit booking</b><div class="f2"><div><label class="lbl">Status</label><select class="inp" id="dStatus">'+['Pending','Assigned','Accepted','On the way','In progress','Completed','Cancelled'].map(function(s){return '<option'+(s===b.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label class="lbl">Total (₹)</label><input class="inp" id="dTotal" type="number" value="'+esc(b.total)+'"></div><div><label class="lbl">Date</label><input class="inp" id="dDate" type="date" value="'+esc(b.date)+'"></div><div><label class="lbl">Time slot</label><input class="inp" id="dSlot" value="'+esc(b.slot)+'"></div></div><label class="lbl">Address</label><textarea class="inp" id="dAddr" style="min-height:60px">'+esc(b.address)+'</textarea><label class="lbl">Internal notes (not shown to customer)</label><textarea class="inp" id="dNotes" style="min-height:60px">'+esc(b.adminNotes)+'</textarea><button class="btn block" style="margin-top:14px" onclick="saveB(this)">Save changes</button>';
  h+='<div class="hr"></div><b>Payment summary</b><div style="margin-top:8px">'+(b.items||[]).map(function(i){return '<div class="sumrow"><span>'+esc(i.name)+' × '+i.qty+'</span><span>'+(i.price?rupee(i.price*i.qty):'Inspection')+'</span></div>'}).join('')+'<div class="sumrow" style="font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Total</span><span>'+rupee(b.total)+'</span></div>'+(b.amountPaid?'<div class="sumrow" style="color:var(--ok);font-weight:700"><span>Collected ('+esc(b.payMode)+')</span><span>'+rupee(b.amountPaid)+'</span></div>':'')+'</div>';
  h+='<div class="hr"></div><b>History</b><div class="tl" style="margin-top:10px">'+(b.history||[]).map(function(x){return '<div class="s done"><b>'+esc(x.s)+'</b><span class="muted small">'+fmtTime(x.t)+(x.by?' · '+esc(x.by):'')+'</span></div>'}).join('')+'</div>';
  $('#drwBody').innerHTML=h;if(!keep)$('#drwBody').scrollTop=0;$('#drw').classList.add('open')}
function closeDrw(){$('#drw').classList.remove('open');curB=null}
function custMsg(b){return 'Hi '+b.name+', thank you for booking with On Your Call!\n\n*Booking ID:* '+b.id+'\n*Service:* '+svcNames(b)+'\n*Date & time:* '+fmtDate(b.date)+', '+b.slot+'\n*Amount:* '+rupee(b.total)+' ('+b.payMode+')'+(b.partnerName?'\n*Your professional:* '+b.partnerName+' ('+b.partnerPhone+')':'')+'\n*Start code:* '+b.otp+' – share it with the professional only when they arrive.\n\nTrack your booking: '+OYC.APP+'\n– Team OYC'}
function partnerMsg(b){return 'New OYC job '+b.id+'\n\n*Service:* '+svcNames(b)+'\n*Date & time:* '+fmtDate(b.date)+', '+b.slot+'\n*Customer:* '+b.name+' ('+b.phone+')\n*Address:* '+b.address+(b.landmark?' (Landmark: '+b.landmark+')':'')+'\n*Map:* '+mapLink(b)+'\n*Collect:* '+rupee(b.total)+(b.notes?'\n*Note:* '+b.notes:'')+'\n\nAccept the job in the OYC Partner app: '+OYC.PARTNER}
function upd(fields,btn,msg){busy(btn,true);return api('adminUpdateBooking',{pin:PIN,id:curB,fields:fields}).then(function(){busy(btn,false);toast(msg||'Saved');return load()}).then(function(){openB(curB,true)}).catch(function(e){busy(btn,false);toast(e.message)})}
function assign(btn){var v=$('#dPartner').value,b=bk(curB);if(v===b.partnerId)return toast('Already assigned');upd({partnerId:v},btn,v?'Partner assigned':'Partner removed')}
function saveB(btn){var b=bk(curB),f={date:$('#dDate').value,slot:$('#dSlot').value,total:Number($('#dTotal').value)||0,address:$('#dAddr').value,adminNotes:$('#dNotes').value};var s=$('#dStatus').value;if(s!==b.status)f.status=s;upd(f,btn)}
function exportCsv(){var cols=['id','created','source','status','name','phone','address','landmark','category','services','total','date','slot','payMode','partnerName','amountPaid','rating','review','notes','adminNotes'];
  var rows=[cols.join(',')].concat(D.bookings.map(function(b){return cols.map(function(c){var v=c==='services'?svcNames(b):b[c];return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'}));a.download='oyc-bookings-'+ymd(new Date())+'.csv';a.click()}

/* ---- new booking (from WhatsApp) ---- */
var nb={};
function openNew(){nb={items:{}};var t=new Date(),slots=['08:00 AM','09:00 AM','10:00 AM','11:00 AM','12:00 PM','01:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM','06:00 PM','07:00 PM'];
  var h='<div class="dh"><button class="ib" onclick="closeDrw()">'+ic('x')+'</button><div class="grow"><b style="font-size:18px">Add WhatsApp booking</b><div class="muted small">Enter a booking received on WhatsApp or phone</div></div></div>';
  h+='<div class="f2"><div><label class="lbl">Customer name *</label><input class="inp" id="nName"></div><div><label class="lbl">Mobile *</label><input class="inp" id="nPhone" type="tel" maxlength="13" placeholder="10-digit mobile"></div></div>';
  h+='<label class="lbl">Address *</label><textarea class="inp" id="nAddr" style="min-height:60px" placeholder="Flat / house no., building, street, area"></textarea><div class="f2"><div><label class="lbl">Landmark</label><input class="inp" id="nLand"></div><div><label class="lbl">Google Maps link / lat,lng (optional)</label><input class="inp" id="nLL" placeholder="17.43,78.40 or maps link"></div></div>';
  h+='<label class="lbl">Services *</label><input class="inp" placeholder="Search services…" oninput="filterPick(this.value)"><div id="nPick" style="max-height:260px;overflow:auto;margin-top:6px">'+SERVICES.map(function(s){return '<div class="pickrow" data-n="'+esc((s.name+' '+catOf(s.cat).name).toLowerCase())+'"><div class="grow">'+esc(s.name)+'<div class="muted small">'+esc(catOf(s.cat).name)+' · '+priceLabel(s)+'</div></div><div class="step"><button onclick="pick(\''+s.id+'\',-1)">−</button><b id="pq-'+s.id+'" style="min-width:20px;text-align:center">0</b><button onclick="pick(\''+s.id+'\',1)">+</button></div></div>'}).join('')+'</div><div class="row between" style="margin-top:8px"><b>Total</b><b id="nTot">₹0</b></div>';
  h+='<div class="f2"><div><label class="lbl">Date *</label><input class="inp" id="nDate" type="date" value="'+ymd(t)+'"></div><div><label class="lbl">Time *</label><select class="inp" id="nSlot">'+slots.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div></div>';
  h+='<label class="lbl">Payment</label><select class="inp" id="nPay"><option>Pay after service (Cash / UPI)</option><option>UPI payment link on WhatsApp</option><option>Paid in advance</option></select><label class="lbl">Customer note</label><textarea class="inp" id="nNotes" style="min-height:60px"></textarea>';
  h+='<label class="lbl">Booking source</label><select class="inp" id="nSrc"><option>WhatsApp</option><option>Phone call</option><option>Walk-in / referral</option></select>';
  h+='<button class="btn gold block" style="margin-top:16px" onclick="createNew(this)">Create booking</button>';
  $('#drwBody').innerHTML=h;$('#drwBody').scrollTop=0;$('#drw').classList.add('open')}
function filterPick(q){q=q.toLowerCase();$$('#nPick .pickrow').forEach(function(r){r.style.display=r.dataset.n.indexOf(q)>=0?'':'none'})}
function pick(id,d){nb.items[id]=Math.max(0,(nb.items[id]||0)+d);$('#pq-'+id).textContent=nb.items[id];var t=0;Object.keys(nb.items).forEach(function(k){t+=(svcOf(k).price||0)*nb.items[k]});$('#nTot').textContent=rupee(t)}
function createNew(btn){var items=Object.keys(nb.items).filter(function(k){return nb.items[k]>0}).map(function(k){var s=svcOf(k);return {id:k,name:s.name,qty:nb.items[k],price:s.price}});
  var ll=($('#nLL').value.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/)||[]),cats=[];items.forEach(function(i){var c=catOf(svcOf(i.id).cat).name;if(cats.indexOf(c)<0)cats.push(c)});
  busy(btn,true,'Creating…');api('adminCreateBooking',{pin:PIN,booking:{name:$('#nName').value.trim(),phone:$('#nPhone').value,address:$('#nAddr').value.trim(),landmark:$('#nLand').value.trim(),lat:ll[1]||'',lng:ll[2]||'',category:cats.join(', '),items:items,total:items.reduce(function(a,i){return a+i.price*i.qty},0),date:$('#nDate').value,slot:$('#nSlot').value,payMode:$('#nPay').value,notes:$('#nNotes').value.trim(),source:$('#nSrc').value}})
  .then(function(b){busy(btn,false);toast('Booking '+b.id+' created');return load().then(function(){openB(b.id)})}).catch(function(e){busy(btn,false);toast(e.message)})}

/* ---- partners ---- */
function vPartners(){var P=D.partners,B=D.bookings;
  var h='<div class="ph"><h1>Partners</h1><button class="btn gold sm" onclick="editP()">+ Add partner</button></div>';
  var pend=P.filter(function(p){return p.status==='Pending'});
  if(pend.length)h+='<div class="panel" style="border-color:var(--gold);margin-bottom:14px"><h3>New registrations to approve ('+pend.length+')</h3>'+pend.map(function(p){return '<div class="row between wrapf" style="padding:10px 0;border-top:1px solid var(--line)"><div><b>'+esc(p.name)+'</b> · '+esc(p.phone)+'<div class="muted small">'+esc(p.skills)+' · '+esc(p.zone)+(p.notes?' · '+esc(p.notes):'')+'</div></div><div class="row"><a class="btn line sm" href="tel:'+esc(p.phone)+'">Call</a><button class="btn sm" style="background:var(--ok)" onclick="setPStatus(\''+p.id+'\',\'Active\',this)">Approve</button><button class="btn line sm" onclick="setPStatus(\''+p.id+'\',\'Blocked\',this)">Reject</button></div></div>'}).join('')+'</div>';
  h+='<div class="panel" style="padding:6px 8px"><div class="scroll"><table class="tbl resp"><thead><tr><th>Partner</th><th>Mobile</th><th>Services</th><th>Area</th><th>Active jobs</th><th>Completed</th><th>Rating</th><th>Status</th><th></th></tr></thead><tbody>'+
  P.filter(function(p){return p.status!=='Pending'}).map(function(p){var mine=B.filter(function(b){return b.partnerId===p.id}),done=mine.filter(function(b){return b.status==='Completed'}),rt=done.filter(function(b){return b.rating});
    return '<tr><td data-l="Partner"><i class="online'+(p.online==='yes'?' y':'')+'"></i><b>'+esc(p.name)+'</b><div class="muted small">'+esc(p.id)+'</div></td><td data-l="Mobile">'+esc(p.phone)+'</td><td data-l="Services" style="max-width:220px" class="small">'+esc(p.skills)+'</td><td data-l="Area">'+esc(p.zone)+'</td><td data-l="Active jobs">'+mine.filter(function(b){return ['Assigned','Accepted','On the way','In progress'].indexOf(b.status)>=0}).length+'</td><td data-l="Completed">'+done.length+'</td><td data-l="Rating">'+(rt.length?(rt.reduce(function(a,b){return a+Number(b.rating)},0)/rt.length).toFixed(1)+' ★':'–')+'</td><td data-l="Status">'+badge(p.status)+'</td><td data-l=""><button class="btn line sm" onclick="editP(\''+p.id+'\')">Edit</button></td></tr>'}).join('')+'</tbody></table></div></div>';
  h+='<p class="muted small" style="margin-top:12px">Partners log in at <a href="'+OYC.PARTNER+'" target="_blank" style="text-decoration:underline">'+OYC.PARTNER.replace('https://','')+'</a> with their mobile number and PIN.</p>';return h}
function setPStatus(id,s,btn){var p=pt(id);busy(btn,true);api('adminSavePartner',{pin:PIN,partner:Object.assign({},p,{status:s,pin:''})}).then(function(){toast(s==='Active'?'Partner approved':'Updated');return load()}).then(renderView).catch(function(e){busy(btn,false);toast(e.message)})}
function editP(id){var p=id?pt(id):{name:'',phone:'',skills:'',zone:'',status:'Active',notes:''},sk=String(p.skills||'').split(',').map(function(s){return s.trim()});
  var h='<div class="dh"><button class="ib" onclick="closeDrw()">'+ic('x')+'</button><b class="grow" style="font-size:18px">'+(id?'Edit partner':'Add partner')+'</b></div>';
  h+='<label class="lbl">Name *</label><input class="inp" id="eName" value="'+esc(p.name)+'"><label class="lbl">Mobile *</label><input class="inp" id="ePhone" type="tel" value="'+esc(p.phone)+'"><label class="lbl">'+(id?'New PIN (leave blank to keep current)':'Login PIN (4 digits) *')+'</label><input class="inp" id="ePin" inputmode="numeric" maxlength="8" placeholder="'+(id?'••••':'e.g. 4821')+'">';
  h+='<label class="lbl">Services</label><div class="row wrapf" id="eSk" style="gap:8px">'+CATS.map(function(c){return '<span class="chip'+(sk.indexOf(c.name)>=0?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+esc(c.name)+'</span>'}).join('')+'</div>';
  h+='<label class="lbl">Work area</label><input class="inp" id="eZone" value="'+esc(p.zone)+'"><label class="lbl">Status</label><select class="inp" id="eStatus">'+['Active','Pending','Blocked'].map(function(s){return '<option'+(s===p.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><label class="lbl">Notes</label><textarea class="inp" id="eNotes">'+esc(p.notes)+'</textarea>';
  h+='<button class="btn block" style="margin-top:16px" onclick="saveP(this,\''+(id||'')+'\')">Save partner</button>';
  $('#drwBody').innerHTML=h;$('#drw').classList.add('open')}
function saveP(btn,id){var pin=$('#ePin').value.trim();if(!id&&!/^\d{4,8}$/.test(pin))return toast('Set a 4-digit PIN for the partner');if(pin&&!/^\d{4,8}$/.test(pin))return toast('PIN must be 4–8 digits');
  busy(btn,true);api('adminSavePartner',{pin:PIN,partner:{id:id||'',name:$('#eName').value.trim(),phone:$('#ePhone').value,pin:pin,skills:$$('#eSk .chip.on').map(function(c){return c.textContent}).join(', '),zone:$('#eZone').value.trim(),status:$('#eStatus').value,notes:$('#eNotes').value.trim()}})
  .then(function(p){toast('Partner saved');closeDrw();if(!id&&confirm('Send login details to '+p.name+' on WhatsApp?'))window.open(waLink(p.phone,'Welcome to On Your Call, '+p.name+'!\n\nLogin to the OYC Partner app: '+OYC.PARTNER+'\nMobile: '+p.phone+'\nPIN: '+pin+'\n\nKeep the app open to receive new jobs.'),'_blank');return load()}).then(renderView).catch(function(e){busy(btn,false);toast(e.message)})}

/* ---- customers ---- */
function vCustomers(){var m={};D.bookings.forEach(function(b){var k=b.phone;if(!m[k])m[k]={name:b.name,phone:k,n:0,spent:0,last:'',addr:b.address};var c=m[k];c.n++;if(b.status==='Completed')c.spent+=Number(b.amountPaid)||0;if(String(b.created)>c.last){c.last=b.created;c.name=b.name;c.addr=b.address}});
  var l=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.last.localeCompare(a.last)});
  return '<div class="ph"><h1>Customers <span class="muted" style="font-size:16px">('+l.length+')</span></h1></div><div class="panel" style="padding:6px 8px"><div class="scroll">'+(l.length?'<table class="tbl resp"><thead><tr><th>Customer</th><th>Mobile</th><th>Bookings</th><th>Spent</th><th>Last booking</th><th>Address</th><th></th></tr></thead><tbody>'+l.map(function(c){return '<tr><td data-l="Customer"><b>'+esc(c.name)+'</b></td><td data-l="Mobile">'+esc(c.phone)+'</td><td data-l="Bookings">'+c.n+'</td><td data-l="Spent">'+rupee(c.spent)+'</td><td data-l="Last booking">'+fmtTime(c.last)+'</td><td data-l="Address" class="small" style="max-width:240px">'+esc(c.addr)+'</td><td data-l=""><div class="row"><a class="btn line sm" href="tel:'+esc(c.phone)+'">Call</a><a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(c.phone,'Hi '+c.name+', greetings from On Your Call!')+'">'+WA_SVG+'</a><button class="btn ghost sm" onclick="fQ=\''+esc(c.phone)+'\';fStatus=\'All\';view(\'bookings\')">Bookings</button></div></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">Customers appear here after their first booking.</div>')+'</div></div>'}

/* ---- services ---- */
function vServices(){var P=(D.settings.prices)||{},O=(D.settings.off)||{};
  var h='<div class="ph"><div><h1>Services & prices</h1><div class="muted">Changes show in the customer app within a minute.</div></div><button class="btn gold" onclick="savePrices(this)">Save prices</button></div>';
  CATS.forEach(function(c){h+='<div class="panel" style="margin-bottom:12px"><h3>'+esc(c.name)+'</h3><div class="svcp muted small" style="font-weight:700"><span>Service</span><span>Price (₹)</span><span>Visible</span></div>'+SERVICES.filter(function(s){return s.cat===c.id}).map(function(s){return '<div class="svcp"><span>'+esc(s.name)+'<div class="muted small">'+esc(s.dur)+' · 0 = free visit</div></span><input class="inp" type="number" min="0" data-p="'+s.id+'" value="'+s.price+'"><button class="sw'+(O[s.id]?'':' on')+'" data-o="'+s.id+'" onclick="this.classList.toggle(\'on\')"></button></div>'}).join('')+'</div>'});
  return h}
function savePrices(btn){var P={},O={};$$('[data-p]').forEach(function(i){P[i.dataset.p]=Number(i.value)||0});$$('[data-o]').forEach(function(b){if(!b.classList.contains('on'))O[b.dataset.o]=1});
  busy(btn,true);api('adminSaveSettings',{pin:PIN,settings:{prices:P,off:O}}).then(function(){busy(btn,false);toast('Prices saved');return load()}).catch(function(e){busy(btn,false);toast(e.message)})}

/* ---- settings ---- */
function vSettings(){var S=D.settings;
  var h='<div class="ph"><h1>Settings</h1></div><div class="grid2"><div>';
  h+='<div class="panel" style="margin-bottom:14px"><h3>Booking server</h3>'+(OYC.API?'<p><span class="badge st-completed">Connected</span> Bookings are stored in your Google Sheet and shared live by the customer, partner and admin apps.</p>':'<p><span class="badge st-pending">Demo mode</span> Data is saved only in this browser. Connect your Google Sheet so all three apps share bookings.</p>')+'<button class="btn ghost sm" onclick="load(true)">Refresh data now</button></div>';
  h+='<div class="panel" style="margin-bottom:14px"><h3>WhatsApp booking number</h3><p class="muted small">Customer bookings are sent to this WhatsApp number.</p><input class="inp" id="sWa" value="'+esc(S.wa||OYC.WA)+'"><button class="btn sm" style="margin-top:10px" onclick="saveSet({wa:$(\'#sWa\').value.replace(/\\D/g,\'\')},this)">Save number</button></div>';
  h+='<div class="panel"><h3>Change admin PIN</h3><input class="inp pin" id="sPin" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN"><button class="btn sm" style="margin-top:10px" onclick="var v=$(\'#sPin\').value;saveSet({newPin:v},this).then(function(){PIN=v;sessionStorage.setItem(\'oyc_admin_pin\',v)})">Update PIN</button><p class="muted small" style="margin-top:8px">Default PIN is 1234 – please change it.</p></div></div>';
  h+='<div><div class="panel" style="margin-bottom:14px"><h3>Your apps</h3>'+[['Customer app',OYC.APP],['Partner app',OYC.PARTNER],['Admin panel',OYC.ADMIN]].map(function(a){return '<div class="row between" style="padding:9px 0;border-top:1px solid var(--line)"><div><b>'+a[0]+'</b><div class="muted small">'+a[1].replace('https://','')+'</div></div><div class="row"><button class="btn ghost sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+a[1]+'\');toast(\'Link copied\')">Copy</button><a class="btn line sm" href="'+a[1]+'" target="_blank">Open</a></div></div>'}).join('')+'</div>';
  h+='<div class="panel"><h3>Data</h3><button class="btn line sm block" onclick="exportCsv()">Export all bookings (CSV)</button><button class="btn line sm block" style="margin-top:8px" onclick="logout()">Logout</button></div></div></div>';return h}
function saveSet(s,btn){busy(btn,true);return api('adminSaveSettings',{pin:PIN,settings:s}).then(function(){busy(btn,false);toast('Saved');return load()}).catch(function(e){busy(btn,false);toast(e.message);throw e})}

fillIcons(document);
if(PIN){api('adminLogin',{pin:PIN}).then(start).catch(function(){$('#vLogin').classList.remove('hide')})}else{$('#vLogin').classList.remove('hide');if(!OYC.API)$('#lHint').textContent='Demo mode – default PIN is 1234'}
</script>
</body></html>
